<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainwater Family DC Trip 2026</title>
  <style>
    :root {
      --navy: #1a2e4a;
      --red: #c0392b;
      --gold: #d4a843;
      --light: #f5f7fa;
      --white: #ffffff;
      --gray: #6b7280;
      --border: #e2e8f0;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--light);
      color: #1f2937;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--navy);
      color: white;
      padding: 24px 20px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px; }
    header p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
    .header-meta {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    /* DAY TABS */
    .day-tabs {
      display: flex;
      overflow-x: auto;
      background: var(--navy);
      border-top: 1px solid rgba(255,255,255,0.1);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      flex-shrink: 0;
      padding: 10px 16px;
      cursor: pointer;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .day-tab:hover { color: white; }
    .day-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }
    .day-tab .date-num { font-size: 1.1rem; display: block; }

    /* MAIN CONTENT */
    main { max-width: 680px; margin: 0 auto; padding: 16px; }

    .day-panel { display: none; }
    .day-panel.active { display: block; }

    .day-header {
      background: var(--navy);
      color: white;
      border-radius: 12px 12px 0 0;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .day-header .theme-icon { font-size: 1.8rem; }
    .day-header h2 { font-size: 1.1rem; font-weight: 700; }
    .day-header .day-date { font-size: 0.82rem; color: #94a3b8; margin-top: 2px; }

    .events-list {
      background: var(--card);
      border-radius: 0 0 12px 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-top: none;
      margin-bottom: 20px;
    }
    .event {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .event:last-child { border-bottom: none; }
    .event-time {
      min-width: 62px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--navy);
      padding-top: 2px;
      text-align: right;
    }
    .event-body { flex: 1; }
    .event-title { font-size: 0.95rem; font-weight: 600; color: #111827; }
    .event-note { font-size: 0.82rem; color: var(--gray); margin-top: 3px; line-height: 1.4; }

    .conf-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .pill-conf { background: #eff6ff; color: #1d4ed8; }
    .pill-addr { background: #f0fdf4; color: #15803d; }
    .pill-cost { background: #fefce8; color: #a16207; }
    .pill-alert { background: #fff7ed; color: #c2410c; }
    .pill-phone { background: #f5f3ff; color: #6d28d9; }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray);
      padding: 10px 18px 4px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    /* TRIP INFO CARD */
    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .info-card-header {
      background: var(--red);
      color: white;
      padding: 10px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .info-card-body { padding: 14px 16px; }
    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.85rem;
      padding: 5px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--gray); font-weight: 500; }
    .info-value { font-weight: 600; text-align: right; }

    /* STILL TO BOOK */
    .todo-card {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }
    .todo-card h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: #c2410c;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #7c2d12;
    }
    .todo-item:last-child { margin-bottom: 0; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.2rem; }
      .event { padding: 12px 14px; }
      .event-time { min-width: 55px; }
    }
  </style>
</head>

function pillClass(type) {
  return { conf: 'pill-conf', addr: 'pill-addr', cost: 'pill-cost', alert: 'pill-alert', phone: 'pill-phone' }[type] || 'pill-conf';
}

function pillIcon(type) {
  return { conf: '🔑', addr: '📍', cost: '💰', alert: '⚠️', phone: '📞' }[type] || '';
}

function renderPills(pills) {
  if (!pills || pills.length === 0) return '';
  return `<div class="conf-row">${pills.map(p => `<span class="pill ${pillClass(p.type)}">${pillIcon(p.type)} ${p.label}</span>`).join('')}</div>`;
}

function renderEvent(ev) {
  return `
    <div class="event">
      <div class="event-time">${ev.time}</div>
      <div class="event-body">
        <div class="event-title">${ev.title}</div>
        ${ev.note ? `<div class="event-note">${ev.note}</div>` : ''}
        ${renderPills(ev.pills)}
      </div>
    </div>
  `;
}

  tab.dataset.idx = i;

  tabsEl.appendChild(tab);
});

`;

function switchDay(idx) {
  document.querySelectorAll('.day-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.day-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  // Scroll the main area to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
  // Scroll tab into view
  const tabs = document.querySelectorAll('.day-tab');
  tabs[idx].scrollIntoView({ behavior: 'smooth', inline: 'center' });
}
</script>

</body>
</html>
